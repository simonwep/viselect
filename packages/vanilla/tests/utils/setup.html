<style>
    #fixture {
        padding: 24px;
    }

    #boundary {
        position: relative;
        width: 240px;
        height: 240px;
        border: 1px solid #142e6e;
        overflow: hidden;
    }

    #boundary.scrollable {
        overflow: auto;
    }

    #start-area {
        position: relative;
        display: grid;
        grid-template-columns: repeat(2, 80px);
        gap: 16px;
        padding: 16px;
        min-height: 100%;
        align-content: start;
    }

    #boundary.scrollable #start-area {
        min-height: 520px;
    }
    
    .selectable,
    .outside {
        background: #b5daf5;
        align-content: center;
        text-align: center;
        width: 80px;
        height: 80px;
    }
    
    .selectable.selected {
        background: #142e6e;
    }

    #tap-overlay {
        position: absolute;
        top: 17px;
        left: 17px;
        width: 78px;
        height: 78px;
        border: 0;
        opacity: 0;
        pointer-events: none;
    }

    #outside {
        margin-top: 16px;
    }
    
    .selection-area {
        background: rgb(252 46 46 / 0.24);
        border: 1px solid red;
    }
</style>

<main id="boundary">
    <section id="start-area">
        <div id="tap-overlay"></div>
    </section>
</main>

<div class="outside">outside</div>
